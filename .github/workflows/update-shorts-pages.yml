name: Update YouTube Shorts Pages

on:
  schedule:
    # 07:00 Europe/Berlin, including DST changes.
    - cron: "0 7 * * *"
      timezone: "Europe/Berlin"
  workflow_dispatch:
    inputs:
      target_date:
        description: "German calendar date to display (YYYY-MM-DD). Leave blank for yesterday."
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync
        
      - name: Run tests
        run: uv run pytest

      - name: Update Shorts data
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -n "$TARGET_DATE" ]; then
            uv run python scripts/update_shorts.py --date "$TARGET_DATE"
          else
            uv run python scripts/update_shorts.py
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        # with:
        #   path: "."
        with:
          path: "./shorts"  

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
